name: Deploy BBB

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Bybit environment for the single BBB stack
        type: choice
        options: [demo, mainnet]
        default: demo
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: bbb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      BYBIT_ENV: ${{ inputs.environment }}
      COMPOSE_PROJECT_NAME: bbb_stack
      ABI_DRY_RUN: "false"
      ABI_LIVE_TRADING_ENABLED: "true"
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-config
    steps:
      - uses: actions/checkout@v4

      - name: Select account and trading data (read-only)
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          env = os.environ['BYBIT_ENV']
          if env not in ('demo', 'mainnet'):
              raise SystemExit('Choose demo or mainnet')
          shared = Path(os.environ['BBB_DATA_ROOT']).resolve(strict=True)
          # Preserve today's Demo layout; Mainnet gets its own trading directories.
          roots = {'demo': shared, 'mainnet': shared / 'mainnet'}
          uid = os.environ.get('ABI_MAINNET_EXPECTED_BYBIT_UID' if env == 'mainnet' else 'ABI_EXPECTED_BYBIT_UID', '')
          if not uid.isascii() or not uid.isdecimal() or uid.startswith('0'):
              raise SystemExit('Set the trusted UID for the selected account')
          selected = roots[env].resolve(strict=True)
          parts = ('abi', 'strategy-runtime/specs', 'strategy-runtime/journal', 'strategy-runtime/state', 'journal')
          demo = [(roots['demo'] / p).resolve() for p in parts]
          mainnet = [(roots['mainnet'] / p).resolve() for p in parts]
          if any(a == b or a in b.parents or b in a.parents for a in demo for b in mainnet):
              raise SystemExit('Demo and Mainnet trading paths overlap')
          for part in parts:
              path = selected / part
              if not path.is_dir() or any(p.is_symlink() for p in path.rglob('*')):
                  raise SystemExit('Prepare separate trading directories without symlinks')
          # Until Runtime has durable state, require a disabled Mainnet catalog; no new marker/store.
          state = selected / 'strategy-runtime/state/runtime_state.jsonl'
          if env == 'mainnet' and (not state.exists() or state.stat().st_size == 0):
              for path in (selected / 'strategy-runtime/specs').iterdir():
                  if not path.is_file() or path.name.startswith('.') or path.suffix != '.json':
                      raise SystemExit('Unexpected strategy catalog entry')
                  item = json.loads(path.read_text())
                  if not isinstance(item, dict) or item.get('enabled') is not False:
                      raise SystemExit('First Mainnet launch requires every strategy disabled')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'BBB_TRADING_DATA_ROOT={selected}\nABI_EXPECTED_BYBIT_UID={uid}\n')
          PYTHON

      - name: Load image manifest
        run: |
          grep -v -e '^#' -e '^$' deploy/images.env >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: |
          mkdir -p "$DOCKER_CONFIG"
          ln -sf "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
          auth=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$DOCKER_CONFIG/config.json"

      - name: Pull images
        run: |
          docker pull "$MDS_IMAGE"
          docker pull "$STRATEGY_ENGINE_IMAGE"
          docker pull "$STRATEGY_RUNTIME_IMAGE"
          docker pull "$ABI_IMAGE"
          docker pull "$RESEARCH_IMAGE"
          docker pull "$JOURNAL_IMAGE"

      - name: Validate compose configuration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml --env-file deploy/images.env config --quiet

      - name: Recreate stack (no volume removal)
        run: |
          if [ -n "$(docker compose -f docker-compose.yml -f docker-compose.deploy.yml --env-file deploy/images.env ps -q)" ]; then
            echo "::error::Stop the current stack before Deploy"
            exit 1
          fi
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml --env-file deploy/images.env up -d --no-build --remove-orphans --force-recreate

      - name: Wait for health/readiness
        run: |
          set -euo pipefail
          services="abi strategy-engine strategy-runtime market-data-service research-service journal-service"
          for i in $(seq 1 30); do
            all_ok=true
            for s in $services; do
              cid=$(docker compose -f docker-compose.yml -f docker-compose.deploy.yml --env-file deploy/images.env ps -q "$s")
              status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "unknown")
              if [ "$status" != "healthy" ]; then
                all_ok=false
              fi
            done
            if [ "$all_ok" = true ]; then
              echo "All services healthy."
              break
            fi
            sleep 5
          done
          if [ "$all_ok" != true ]; then
            echo "::error::One or more services failed to become healthy in time"
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml --env-file deploy/images.env ps
            exit 1
          fi

      - name: Verify Runtime liveness
        run: |
          curl -fsS http://127.0.0.1:8093/health/live > /dev/null
          curl -fsS http://127.0.0.1:8093/health/ready > /dev/null

      - name: Verify running image refs match manifest
        run: |
          set -euo pipefail
          check() {
            svc="$1"; expected="$2"
            cid=$(docker compose -f docker-compose.yml -f docker-compose.deploy.yml --env-file deploy/images.env ps -q "$svc")
            actual=$(docker inspect --format '{{.Config.Image}}' "$cid")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$svc image mismatch: running=$actual expected=$expected"
              exit 1
            fi
            echo "$svc OK: $actual"
          }
          check abi "$ABI_IMAGE"
          check strategy-engine "$STRATEGY_ENGINE_IMAGE"
          check strategy-runtime "$STRATEGY_RUNTIME_IMAGE"
          check market-data-service "$MDS_IMAGE"
          check research-service "$RESEARCH_IMAGE"
          check journal-service "$JOURNAL_IMAGE"

      - name: Verify selected environment and locked ABI
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8787/execution/mode', timeout=5) as response:
              mode = json.load(response)
          if mode['bybitEnvironment'] != os.environ['BYBIT_ENV'] or mode['canExecuteLive']:
              raise SystemExit('Unexpected ABI execution mode')
          # Query the existing socket client inside ABI; never deliver credentials here.
          import subprocess
          cid = subprocess.check_output(['docker', 'compose', '-f', 'docker-compose.yml', '-f',
              'docker-compose.deploy.yml', '--env-file', 'deploy/images.env', 'ps', '-q', 'abi']).decode().strip()
          reply = subprocess.check_output(['docker', 'exec', '-i', cid, 'node',
              '/app/dist/authorization/credentialRelay.js'], input=b'{"v":1,"op":"status"}\n')
          if json.loads(reply)['state'] != 'LOCKED':
              raise SystemExit('ABI must be LOCKED after Deploy')
          PYTHON

      - name: Summary
        if: always()
        run: |
          echo "## Deploy BBB summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- MDS: $MDS_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Strategy Engine: $STRATEGY_ENGINE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Strategy Runtime: $STRATEGY_RUNTIME_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- ABI: $ABI_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Research Service: $RESEARCH_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Journal Service: $JOURNAL_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: $BYBIT_ENV" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up local docker credentials
        if: always()
        run: rm -rf "$DOCKER_CONFIG"
