services:
  abi:
    image: ${ABI_IMAGE:?ABI_IMAGE must be set (see deploy/images.env)}

  strategy-engine:
    image: ${STRATEGY_ENGINE_IMAGE:?STRATEGY_ENGINE_IMAGE must be set (see deploy/images.env)}

  strategy-runtime:
    image: ${STRATEGY_RUNTIME_IMAGE:?STRATEGY_RUNTIME_IMAGE must be set (see deploy/images.env)}

  market-data-service:
    image: ${MDS_IMAGE:?MDS_IMAGE must be set (see deploy/images.env)}
    # Same mounts as the base file: the market config comes from the
    # host-owned ${BBB_DATA_ROOT}/mds, not from the image.
    volumes: !override
      - type: bind
        source: ${BBB_DATA_ROOT:?BBB_DATA_ROOT must be set}/mds
        target: /app/config-host
        read_only: true
      - type: bind
        source: ${BBB_DATA_ROOT:?BBB_DATA_ROOT must be set}/market-data
        target: /data

  research-service:
    image: ${RESEARCH_IMAGE:?RESEARCH_IMAGE must be set (see deploy/images.env)}

  journal-service:
    image: ${JOURNAL_IMAGE:?JOURNAL_IMAGE must be set (see deploy/images.env)}
