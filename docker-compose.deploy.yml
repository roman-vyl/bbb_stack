services:
  abi:
    image: ${ABI_IMAGE:?ABI_IMAGE must be set (see deploy/images.env)}
    platform: linux/amd64

  strategy-engine:
    image: ${STRATEGY_ENGINE_IMAGE:?STRATEGY_ENGINE_IMAGE must be set (see deploy/images.env)}
    platform: linux/amd64

  strategy-runtime:
    image: ${STRATEGY_RUNTIME_IMAGE:?STRATEGY_RUNTIME_IMAGE must be set (see deploy/images.env)}
    platform: linux/amd64

  market-data-service:
    image: ${MDS_IMAGE:?MDS_IMAGE must be set (see deploy/images.env)}
    platform: linux/amd64
    # No sibling market_data_service checkout exists in deploy mode, so
    # drop the base file's config bind mount and use the markets.toml
    # already baked into the image at build time.
    volumes: !override
      - type: bind
        source: ${BBB_DATA_ROOT:?BBB_DATA_ROOT must be set}/market-data
        target: /data
