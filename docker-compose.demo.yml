services:
  abi:
    restart: "no"
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    ulimits:
      core: 0
    tmpfs:
      - /run/abi-credentials:rw,noexec,nosuid,nodev,size=65536,uid=1000,gid=1000,mode=0700
    environment:
      ABI_PROTECTED_CREDENTIALS_DIR: "/run/abi-credentials"
      ABI_DRY_RUN: "false"
      ABI_LIVE_TRADING_ENABLED: "true"
      BYBIT_ENV: "demo"
      ABI_POSITION_SIZING_MODE: "risk"
      # Bybit demo account is in hedge mode (both sides per coin); ABI sends
      # positionIdx 1/2 and checks the coin mode before each entry.
      ABI_BYBIT_LINEAR_POSITION_BINDING_MODE: "hedge"
      # Exchange facts journal: private WS stream recorder + order linker,
      # SQLite at /app/var/abi_exchange_facts_demo.sqlite3 (BBB_data/abi).
      # Never stops trading; "false" turns it off.
      ABI_EXCHANGE_FACTS_ENABLED: "true"
